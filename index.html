<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queen's School (Junior) Ibadan</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>QUEEN'S SCHOOL (JUNIOR) IBADAN</h1>
      </div>
      <nav>
        <button id="show-registration-btn" class="nav-btn active">Registration</button>
        <button id="show-admin-btn" class="nav-btn">Admin Panel</button>
      </nav>
    </header>

    <main>
      <section id="registration-section" class="panel">
        <h2>Student Registration</h2>
        <form id="student-form">
          <div class="form-grid">
            <label>Student Full Name<input name="studentFullName" required /></label>
            <label>Date of Birth<input type="date" name="dateOfBirth" required /></label>
            <label>Home Address<input name="homeAddress" required /></label>
            <label>Local Government of Origin<input name="localGovernment" required /></label>
            <label>State of Origin<input name="stateOfOrigin" required /></label>
            <label>Parent/Guardian Name<input name="parentName" required /></label>
            <label>Parent/Guardian Phone<input name="parentPhone" required /></label>
            <label>Last School Attended<input name="lastSchool" /></label>
            <label>Last Class Attended<input name="lastClass" /></label>
            <label>Religion<input name="religion" required /></label>
          </div>
          <div class="actions-row">
            <button type="submit" class="primary">Register Student</button>
          </div>
        </form>
        <div id="registration-message" class="message"></div>
      </section>

      <section id="admin-section" class="panel hidden">
        <div class="admin-header">
          <h2>Admin Panel</h2>
          <div class="admin-login-box">
            <input id="admin-username" placeholder="Admin username" />
            <input id="admin-password" type="password" placeholder="Admin password" />
            <button id="admin-login-btn" class="secondary">Login</button>
          </div>
        </div>

        <div id="admin-content" class="hidden">
          <div class="toolbar-row">
            <input id="admin-search" placeholder="Search by admission, name or phone" />
            <select id="admin-class-filter">
              <option value="">All Classes</option>
              <option value="JSS1Q">JSS1Q</option>
              <option value="JSS1S">JSS1S</option>
              <option value="JSS1I">JSS1I</option>
              <option value="JSS1Y">JSS1Y</option>
              <option value="JSS1N">JSS1N</option>
            </select>
            <button id="export-students-btn" class="secondary">Export Students</button>
            <button id="export-deleted-btn" class="secondary">Export Deleted</button>
          </div>

          <div id="dashboard-stats" class="stats-grid"></div>

          <div class="tabs">
            <button class="tab-btn active" data-tab="students-tab">STUDENTS</button>
            <button class="tab-btn" data-tab="deleted-tab">DELETED RECORDS</button>
          </div>

          <div id="students-tab" class="tab-panel active">
            <table>
              <thead>
                <tr>
                  <th>Admission Number</th>
                  <th>Student Name</th>
                  <th>Class</th>
                  <th>Parent/Guardian</th>
                  <th>Phone</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="students-table-body"></tbody>
            </table>
          </div>

          <div id="deleted-tab" class="tab-panel hidden">
            <table>
              <thead>
                <tr>
                  <th>Admission Number</th>
                  <th>Student Name</th>
                  <th>Class</th>
                  <th>Original Registration Date</th>
                  <th>Deleted Date</th>
                  <th>Deleted By</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="deleted-table-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <div id="delete-modal" class="modal hidden" aria-modal="true" role="dialog">
      <div class="modal-card">
        <h3>DELETE REGISTRATION?</h3>
        <div id="delete-confirmation-body"></div>
        <div class="modal-actions">
          <button id="cancel-delete-btn" class="secondary">CANCEL</button>
          <button id="confirm-delete-btn" class="danger">DELETE STUDENT</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
  </body>
</html>
